name: Deploy The Four to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static campaign
        env:
          NEXT_PUBLIC_BASE_PATH: /thefour
          NEXT_PUBLIC_FOUR_API_URL: https://pblahfvxzldcjyurpvgd.supabase.co/functions/v1/thefour-api
          NEXT_PUBLIC_THE_FOUR_POSTER_URL: ${{ secrets.NEXT_PUBLIC_THE_FOUR_POSTER_URL }}
          NEXT_PUBLIC_TICKETING_URL: ${{ secrets.NEXT_PUBLIC_TICKETING_URL }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4