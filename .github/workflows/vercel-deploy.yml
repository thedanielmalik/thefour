name: Deploy The Four to Vercel

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    if: \${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: \${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: \${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_DASHBOARD_TOKEN: \${{ secrets.ADMIN_DASHBOARD_TOKEN }}
      NEXT_PUBLIC_THE_FOUR_POSTER_URL: \${{ secrets.NEXT_PUBLIC_THE_FOUR_POSTER_URL }}
      NEXT_PUBLIC_TICKETING_URL: \${{ secrets.NEXT_PUBLIC_TICKETING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Deploy
        run: npx vercel --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}